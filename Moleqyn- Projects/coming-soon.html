<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon - Moleqyn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background: var(--bg-base);
      color: var(--text-primary);
    }
    .soon-container {
      max-width: 600px;
      padding: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: var(--primary-color);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: var(--secondary-color);
      box-shadow: 0 4px 15px rgba(255,0,204,0.3);
    }
  </style>
</head>
<body>
  <div class="soon-container">
    <div style="font-size: 4rem; margin-bottom: 10px;">🚀</div>
    <h1>Coming Soon</h1>
    <p>We are working hard to build this feature for you. This module will be available in an upcoming update!</p>
    <a href="index.html" class="btn">Return to Home</a>
  </div>
</body>
</html>
