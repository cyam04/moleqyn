<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#070f1e"/>
  <!-- Flask Body -->
  <path d="M26 12 h12 v10 l14 24 a6 6 0 0 1 -5 10 h-30 a6 6 0 0 1 -5 -10 l14 -24 v-10 z" 
        fill="none" stroke="url(#grad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Liquid -->
  <path d="M19 46 q7 -4 13 0 t13 0 l4 6 a4 4 0 0 1 -3.5 4 h-29 a4 4 0 0 1 -3.5 -4 z" 
        fill="url(#grad)" opacity="0.85"/>
  <!-- Bubbles -->
  <circle cx="28" cy="42" r="2.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="36" cy="38" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="32" cy="48" r="2" fill="#ffffff" opacity="0.9"/>
</svg>
